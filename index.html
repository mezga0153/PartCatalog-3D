<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GLB Box Viewer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Popup styles -->
    <link href="css/popup.css" rel="stylesheet">
    <!-- File upload styles -->
    <link href="css/file-upload.css" rel="stylesheet">
    <!-- Parts panel styles -->
    <link href="css/parts-panel.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <nav class="sidebar-tabs">
            <button type="button" class="sidebar-tab active" data-pane="partsPane">Parts <span class="parts-count badge"></span></button>
            <button type="button" class="sidebar-tab" data-pane="summaryPane">Summary</button>
            <button type="button" class="sidebar-collapse" title="Show / hide the panel" aria-label="Show or hide the panel"><i class="bi bi-chevron-down"></i></button>
        </nav>
        <!-- Rendered by parts-table.js and summary-panel.js -->
        <div class="sidebar-pane" id="partsPane"></div>
        <div class="sidebar-pane" id="summaryPane" hidden></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <!-- Application (ES modules) -->
    <script type="module" src="viewer.js"></script>
</body>

</html>
